# =====================================================================
# Portfolio Engine configuration
# Long only, individual equity, basket constrained Sharpe maximiser
# Edit this file to change the universe, baskets, and settings.
# No code changes needed for config edits.
# =====================================================================


settings:
  lookback_years: 5            # years of daily history for return/cov estimation
  annualisation: 252           # trading days per year
  num_simulations: 50000       # Monte Carlo portfolios
  expected_returns: historical # historical | black_litterman (Phase 2; BL uses views.yaml)
  covariance_estimator: simple # simple (shrinkage below) | ledoit_wolf (analytic intensity)
  shrinkage: 0.10              # covariance shrinkage toward diagonal (simple estimator only)
  max_position: 0.07           # max weight in any single name
  min_position: 0.00           # long only floor
  transaction_cost_bps: 10     # one way cost in basis points, used in backtest
  benchmark: SPY               # market proxy for CAPM betas and backtest comparison
  rebalance: monthly

risk_free:
  mode: live                   # live = fetch 3 month T bill (^IRX) from Yahoo, FRED fallback
  manual_rate: 0.045           # used only if mode = manual or all live sources fail
  cml_long_rate_ticker: ^TNX   # 10 year yield, shown alongside for context

# ---------------------------------------------------------------------
# Black Litterman (Phase 2). Active only when settings.expected_returns
# is black_litterman. Views live in views.yaml and ship empty; with no
# views the model uses pure market implied equilibrium returns. For a
# single name universe the AUM proxy is unavailable, so the prior falls
# back to inverse volatility weights (labelled in the run output).
# ---------------------------------------------------------------------
black_litterman:
  tau: 0.05                       # uncertainty of the equilibrium prior (literature standard)
  views_file: views.yaml          # owner's views with confidences; empty by default
  market_weights_cache_days: 7    # reuse cached market weight proxy this many days

# ---------------------------------------------------------------------
# Robustness diagnostics: bootstrap weight stability and expected
# return sensitivity. Adds ~15-30s to a run; disable for quick checks.
# ---------------------------------------------------------------------
robustness:
  enabled: true
  n_bootstrap: 100               # resampled re-optimisations
  sensitivity_bump: 0.01         # +/- shift applied to each name's expected return

# ---------------------------------------------------------------------
# Universe: 28 individual equities. Yahoo symbols. US listed ADRs are
# used where available (TM, SONY, MUFG, TSM, HDB, BHP) and local lines
# where not ('8058.T', D05.SI, '1299.HK', CSL.AX, CBA.AX, '0700.HK').
# Non USD lines are converted to USD by the engine data layer using the
# analyzer currency logic, and every conversion is reported on each run.
# ---------------------------------------------------------------------
universe:
  # US core
  LLY:    Eli Lilly
  JNJ:    Johnson & Johnson
  PG:     Procter & Gamble
  KO:     Coca-Cola
  JPM:    JPMorgan Chase
  BRK-B:  Berkshire Hathaway
  WMT:    Walmart
  NEE:    NextEra Energy
  UNP:    Union Pacific
  MSFT:   Microsoft
  V:      Visa
  # APAC core
  TM:      Toyota Motor (ADR)
  SONY:    Sony Group (ADR)
  MUFG:    Mitsubishi UFJ Financial (ADR)
  '8058.T': Mitsubishi Corp (Tokyo)
  TSM:     Taiwan Semiconductor (ADR)
  D05.SI:  DBS Group (Singapore)
  '1299.HK': AIA Group (Hong Kong)
  HDB:     HDFC Bank (ADR)
  CSL.AX:  CSL Limited (Australia)
  CBA.AX:  Commonwealth Bank (Australia)
  '0700.HK': Tencent Holdings (Hong Kong)
  # Commodities (producer equities only, no oil or gas)
  NEM:    Newmont (gold)
  AEM:    Agnico Eagle Mines (gold)
  BHP:    BHP Group (ADR, diversified mining)
  FCX:    Freeport-McMoRan (copper)
  NTR:    Nutrien (agriculture, fertiliser)
  CCJ:    Cameco (uranium)

# ---------------------------------------------------------------------
# Baskets. Each basket = named group of tickers with a min and max total
# portfolio weight. The optimiser maximises Sharpe while respecting every
# basket range and the single name cap. These are YOUR allocation views.
# ---------------------------------------------------------------------
baskets:
  us_core:
    thesis: US large cap quality across healthcare, staples, financials, industrials and tech
    tickers: [LLY, JNJ, PG, KO, JPM, BRK-B, WMT, NEE, UNP, MSFT, V]
    min: 0.35
    max: 0.55
  apac_core:
    thesis: Asia Pacific large caps across Japan, Taiwan, Singapore, Hong Kong, India and Australia
    tickers: [TM, SONY, MUFG, '8058.T', TSM, D05.SI, '1299.HK', HDB, CSL.AX, CBA.AX, '0700.HK']
    min: 0.25
    max: 0.45
  commodities:
    thesis: Producer equities only, no oil or gas; gold, diversified mining, copper, fertiliser, uranium
    tickers: [NEM, AEM, BHP, FCX, NTR, CCJ]
    min: 0.15
    max: 0.25

# ---------------------------------------------------------------------
# Target weights: the owner's intended allocation per name (decimals,
# sum to 1.0). Used as the default current weights in the basket editor
# and as documentation. The optimiser does not read these; it only
# enforces the basket bands and the single name cap above.
# ---------------------------------------------------------------------
target_weights:
  # US core (45%)
  LLY: 0.05
  JNJ: 0.04
  PG: 0.04
  KO: 0.03
  JPM: 0.05
  BRK-B: 0.05
  WMT: 0.04
  NEE: 0.03
  UNP: 0.03
  MSFT: 0.05
  V: 0.04
  # APAC core (35%)
  TM: 0.04
  SONY: 0.03
  MUFG: 0.03
  '8058.T': 0.03
  TSM: 0.04
  D05.SI: 0.03
  '1299.HK': 0.03
  HDB: 0.03
  CSL.AX: 0.03
  CBA.AX: 0.03
  '0700.HK': 0.03
  # Commodities (20%)
  NEM: 0.04
  AEM: 0.03
  BHP: 0.04
  FCX: 0.03
  NTR: 0.03
  CCJ: 0.03

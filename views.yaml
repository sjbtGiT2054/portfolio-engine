# =====================================================================
# Black Litterman views — YOUR macro judgement goes here.
#
# This file ships EMPTY on purpose. With no active views the model uses
# pure market implied equilibrium returns, which is the neutral default.
# Uncomment and edit an example below when you have a view you are
# willing to defend in the rebalance log.
#
# Two view types:
#
#   Absolute — "these assets will earn X% over the risk free rate":
#     - name: pharma_rerate
#       assets: [LLY]              # one or more tickers, equal weighted
#       excess_return: 0.06        # 6% annual excess return
#       confidence: 0.5            # in (0, 1]: higher = tilts the posterior more
#
#   Relative — "the long leg beats the short leg by X%":
#     - name: semis_over_staples
#       long: [TSM]                # equal weighted long leg
#       short: [PG]                # equal weighted short leg (a VIEW, not a
#       outperformance: 0.02       #   short position; the portfolio stays long only)
#       confidence: 0.3
#
# Confidence guide: 0.25 = mild lean, 0.5 = conviction, 0.75+ = strong
# conviction you would put in writing. Views on tickers outside
# config.yaml's universe raise an error rather than being ignored.
# =====================================================================

views: []
